name: nvEnvy
options:
  bundleIdPrefix: com.nvenvy
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  xcodeVersion: "15.0"
  minimumXcodeGenVersion: "2.35"

packages:
  NvEnvyCore:
    path: ../NvEnvyCore
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.5.0"

targetTemplates:
  nvEnvyMacBase:
    type: application
    platform: macOS
    sources:
      - path: nvEnvy
        excludes:
          - "Fonts"
          - "Info.plist"
          - "Info-MAS.plist"
      - path: nvEnvy/Fonts
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nvenvy.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Kendall Miller. Made at Lunt.co. Released under the MIT License."
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_ENTITLEMENTS: nvEnvy/nvEnvy.entitlements
        ARCHS: "$(ARCHS_STANDARD)"
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: nvEnvy/nvEnvy.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.network.client: true
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.nvenvy.app

targets:
  nvEnvy:
    templates: [nvEnvyMacBase]
    info:
      path: nvEnvy/Info.plist
      properties:
        ATSApplicationFontsPath: Fonts
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        SUFeedURL: "https://nvenvy.app/appcast.xml"
        NSAppleScriptEnabled: true
        OSAScriptingDefinition: nvEnvy.sdef
        NSServices:
          - NSMenuItem:
              default: "nvEnvy: New Note from Selection"
            NSMessage: createFromSelection
            NSPortName: nvEnvy
            NSSendTypes:
              - public.utf8-plain-text
              - public.rtf
              - public.html
        CFBundleURLTypes:
          - CFBundleURLName: nvEnvy URL Scheme
            CFBundleURLSchemes:
              - nvenvy
              - nv
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown
            CFBundleTypeExtensions:
              - md
              - markdown
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
          - CFBundleTypeName: Plain Text
            CFBundleTypeExtensions:
              - txt
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
          - CFBundleTypeName: Rich Text
            CFBundleTypeExtensions:
              - rtf
            CFBundleTypeRole: Viewer
            LSHandlerRank: None
          - CFBundleTypeName: HTML
            CFBundleTypeExtensions:
              - html
              - htm
            CFBundleTypeRole: Viewer
            LSHandlerRank: None
          - CFBundleTypeName: RTFD
            CFBundleTypeExtensions:
              - rtfd
            CFBundleTypeRole: Viewer
            LSHandlerRank: None
          - CFBundleTypeName: Web Archive
            CFBundleTypeExtensions:
              - webarchive
            CFBundleTypeRole: Viewer
            LSHandlerRank: None
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: SPARKLE_ENABLED
    dependencies:
      - package: NvEnvyCore
      - package: KeyboardShortcuts
      - package: Sparkle

  nvEnvy-MAS:
    templates: [nvEnvyMacBase]
    settings:
      base:
        # Ships as nvEnvy.app, same as the direct-download target, so both write
        # to Build/Products/<config>/nvEnvy.app. Building one after the other
        # into shared DerivedData overwrites the first in place without cleaning
        # and leaves a hybrid bundle. Build each scheme with its own
        # -derivedDataPath (see RELEASING.md and .github/workflows/ci.yml).
        # CONFIGURATION_BUILD_DIR does not work here: it moves this target's
        # products but not the SwiftPM package products it links against.
        PRODUCT_NAME: nvEnvy
    info:
      path: nvEnvy/Info-MAS.plist
      properties:
        ATSApplicationFontsPath: Fonts
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        NSAppleScriptEnabled: true
        OSAScriptingDefinition: nvEnvy.sdef
        NSServices:
          - NSMenuItem:
              default: "nvEnvy: New Note from Selection"
            NSMessage: createFromSelection
            NSPortName: nvEnvy
            NSSendTypes:
              - public.utf8-plain-text
              - public.rtf
              - public.html
        CFBundleURLTypes:
          - CFBundleURLName: nvEnvy URL Scheme
            CFBundleURLSchemes:
              - nvenvy
              - nv
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown
            CFBundleTypeExtensions:
              - md
              - markdown
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
          - CFBundleTypeName: Plain Text
            CFBundleTypeExtensions:
              - txt
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
          - CFBundleTypeName: Rich Text
            CFBundleTypeExtensions:
              - rtf
            CFBundleTypeRole: Viewer
            LSHandlerRank: None
          - CFBundleTypeName: HTML
            CFBundleTypeExtensions:
              - html
              - htm
            CFBundleTypeRole: Viewer
            LSHandlerRank: None
          - CFBundleTypeName: RTFD
            CFBundleTypeExtensions:
              - rtfd
            CFBundleTypeRole: Viewer
            LSHandlerRank: None
          - CFBundleTypeName: Web Archive
            CFBundleTypeExtensions:
              - webarchive
            CFBundleTypeRole: Viewer
            LSHandlerRank: None
    dependencies:
      - package: NvEnvyCore
      - package: KeyboardShortcuts

  nvEnvyiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    info:
      path: nvEnvyiOS/Info.plist
      properties:
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: nvEnvy URL Scheme
            CFBundleURLSchemes:
              - nvenvy
              - nv
        UIAppFonts:
          - AtkinsonHyperlegible-Regular.ttf
          - AtkinsonHyperlegible-Bold.ttf
          - AtkinsonHyperlegible-Italic.ttf
          - AtkinsonHyperlegible-BoldItalic.ttf
          - OpenDyslexic-Regular.otf
          - OpenDyslexic-Bold.otf
          - OpenDyslexic-Italic.otf
          - OpenDyslexic-BoldItalic.otf
    sources:
      - path: nvEnvyiOS
        excludes:
          - "Entitlements.plist"
          - "Info.plist"
      - path: nvEnvy/Fonts
        type: folder
        buildPhase: resources
      - path: nvEnvy/Localizable.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nvenvy.app.ios
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: B35T5FY8RZ
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: nvEnvyiOS/Entitlements.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: NvEnvyCore

schemes:
  "nvEnvy (App Store)":
    build:
      targets:
        nvEnvy-MAS: all
    run:
      config: Release
      executable: nvEnvy-MAS
    archive:
      config: Release
  "nvEnvy (Direct Download)":
    build:
      targets:
        nvEnvy: all
    run:
      config: Release
      executable: nvEnvy
    archive:
      config: Release
  nvEnvyiOS:
    build:
      targets:
        nvEnvyiOS: all
    run:
      config: Debug
      executable: nvEnvyiOS
    archive:
      config: Release
