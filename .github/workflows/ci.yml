name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core-tests:
    name: NvEnvyCore unit tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Run tests
        working-directory: NvEnvyCore
        run: swift test --parallel

  app-build:
    name: nvEnvy app build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: nvEnvy
        run: xcodegen generate
      - name: Build nvEnvy (direct-download / Sparkle)
        working-directory: nvEnvy
        run: |
          xcodebuild \
            -project nvEnvy.xcodeproj \
            -scheme "nvEnvy (Direct Download)" \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build/dd-direct \
            CODE_SIGNING_ALLOWED=NO \
            build
      # Separate -derivedDataPath: both targets produce nvEnvy.app, so sharing
      # one would have this build overwrite the previous step's bundle in place
      # and fail on the leftover files.
      - name: Build nvEnvy-MAS (App Store, no Sparkle)
        working-directory: nvEnvy
        run: |
          xcodebuild \
            -project nvEnvy.xcodeproj \
            -scheme "nvEnvy (App Store)" \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build/dd-appstore \
            CODE_SIGNING_ALLOWED=NO \
            build
